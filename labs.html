<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labs — Nira Labs</title>
  <meta name="description" content="Experimentos visuales e historias inmersivas de Nira Labs.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Three.js via importmap -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    /* ════════════════════════════════════════
       RESET & TOKENS
    ════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --nira-base:    #0A0F1C;
      --nira-surface: #111827;
      --nira-border:  rgba(255,255,255,0.06);
      --nira-text:    #E8ECF0;
      --nira-muted:   #6B7280;
      --nira-cyan:    #00D4FF;
      --nira-violet:  #A78BFA;
      --nira-pink:    #F472B6;
      --nira-emerald: #34D399;
    }

    html { -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'IBM Plex Sans', -apple-system, sans-serif;
      background: #020408;
      color: var(--nira-text);
      overflow-x: hidden;
    }

    /* ════════════════════════════════════════
       WORDMARK
    ════════════════════════════════════════ */
    .wordmark {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      letter-spacing: -1.5px;
      line-height: 1;
      display: inline-flex;
      align-items: baseline;
      text-decoration: none;
    }
    .wm-nira { color: var(--nira-text); }
    .wm-l    { color: var(--nira-cyan); }
    .wm-a    { color: var(--nira-violet); }
    .wm-b    { color: var(--nira-pink); }
    .wm-s    { color: var(--nira-emerald); }

    /* ════════════════════════════════════════
       NAV
    ════════════════════════════════════════ */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0 48px;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(2,4,8,0.0);
      transition: background 0.3s ease, border-color 0.3s ease;
      border-bottom: 1px solid transparent;
    }

    nav.scrolled {
      background: rgba(2,4,8,0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--nira-border);
      height: 60px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-links a {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(232,236,240,0.5);
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: color 0.2s ease;
      padding: 8px 14px;
      border-radius: 8px;
    }

    .nav-links a:hover,
    .nav-links a.active { color: var(--nira-text); }

    .nav-cta {
      position: relative;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--nira-text);
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 8px;
      background: transparent;
      isolation: isolate;
      transition: background 0.2s ease;
    }

    .nav-cta::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 8px;
      padding: 1.5px;
      background: linear-gradient(135deg, #00D4FF, #A78BFA, #F472B6, #34D399);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .nav-hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 44px; height: 44px;
      background: rgba(2,4,8,0.6);
      border: 1px solid rgba(232,236,240,0.15);
      border-radius: 8px;
      cursor: pointer;
      gap: 5px;
      padding: 0;
      -webkit-appearance: none;
      z-index: 101;
      flex-shrink: 0;
    }

    .nav-hamburger span {
      display: block;
      width: 22px; height: 2px;
      background: #E8ECF0;
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
      transform-origin: center;
    }

    .nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      background: #020408;
      z-index: 90;
      flex-direction: column;
      justify-content: center;
      padding: 0 40px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .mobile-menu.open { opacity: 1; pointer-events: auto; }

    .mobile-menu a {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 36px;
      font-weight: 700;
      color: var(--nira-text);
      text-decoration: none;
      padding: 14px 0;
      border-bottom: 1px solid var(--nira-border);
      letter-spacing: -0.5px;
      transition: color 0.2s ease;
    }

    .mobile-menu a:hover { color: var(--nira-cyan); }

    /* ════════════════════════════════════════
       EXPERIMENT STAGE
    ════════════════════════════════════════ */
    #stage {
      position: relative;
      width: 100%;
      /* height set by experiment */
    }

    /* Canvas fullscreen sticky — inyectado por el experimento */
    #stage canvas {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      display: block;
    }

    /* ════════════════════════════════════════
       STORY PANELS — texto narrativo
    ════════════════════════════════════════ */
    .story-panel {
      position: absolute;
      left: 0; right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 0 24px;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .story-panel.visible { opacity: 1; }

    .story-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--nira-cyan);
      margin-bottom: 20px;
      opacity: 0.7;
    }

    .story-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(32px, 5vw, 72px);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1.05;
      color: #ffffff;
      text-align: center;
      margin-bottom: 16px;
    }

    .story-body {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: clamp(14px, 1.8vw, 18px);
      font-weight: 300;
      color: rgba(232,236,240,0.55);
      line-height: 1.7;
      text-align: center;
      max-width: 520px;
    }

    .story-divider {
      width: 40px;
      height: 1px;
      background: var(--nira-cyan);
      opacity: 0.4;
      margin: 24px auto;
    }

    /* ════════════════════════════════════════
       LOADING STATE
    ════════════════════════════════════════ */
    #loader {
      position: fixed;
      inset: 0;
      background: #020408;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: opacity 0.6s ease;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .loader-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--nira-cyan);
      animation: loaderPulse 1.4s ease-in-out infinite;
    }

    .loader-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(232,236,240,0.25);
    }

    @keyframes loaderPulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50%       { transform: scale(2); opacity: 1; }
    }

    /* ════════════════════════════════════════
       RESPONSIVE
    ════════════════════════════════════════ */
    @media (max-width: 768px) {
      nav { padding: 0 20px; }
      .nav-links, .nav-cta { display: none; }
      .nav-hamburger { display: flex; }
      .mobile-menu { display: flex; }
    }
  </style>
</head>
<body>

  <!-- Loader -->
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-dot"></div>
      <p class="loader-text">Cargando experimento</p>
    </div>
  </div>

  <!-- Nav -->
  <nav id="navbar">
    <a href="index.html" class="wordmark" style="font-size:28px;">
      <span class="wm-nira">nira</span><span class="wm-l">l</span><span class="wm-a">a</span><span class="wm-b">b</span><span class="wm-s">s</span>
    </a>
    <div class="nav-links">
      <a href="labs.html" class="active">Labs</a>
      <a href="index.html#proyectos">Proyectos</a>
      <a href="index.html#estudio">Estudio</a>
      <a href="radio.html">Radio</a>
      <a href="index.html#contacto">Contacto</a>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="index.html#contacto" class="nav-cta">Iniciar proyecto →</a>
      <button class="nav-hamburger" id="hamburger" aria-label="Abrir menú">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobile-menu">
    <a href="labs.html" class="mobile-nav-link active">Labs</a>
    <a href="index.html#proyectos" class="mobile-nav-link">Proyectos</a>
    <a href="index.html#estudio" class="mobile-nav-link">Estudio</a>
    <a href="radio.html" class="mobile-nav-link">Radio</a>
    <a href="index.html#contacto" class="mobile-nav-link">Contacto</a>
    <a href="index.html#contacto" class="mobile-menu-cta">Iniciar proyecto →</a>
  </div>

  <!-- Experiment stage -->
  <main id="stage"></main>

  <script type="module" src="labs.js"></script>

  <script>
    // Nav scroll state
    const nav = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 20);
    }, { passive: true });

    // Hamburger
    const ham = document.getElementById('hamburger');
    const mob = document.getElementById('mobile-menu');
    ham.addEventListener('click', () => {
      const open = ham.classList.toggle('open');
      mob.classList.toggle('open', open);
    });
    mob.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      ham.classList.remove('open');
      mob.classList.remove('open');
    }));
  </script>

</body>
</html>
